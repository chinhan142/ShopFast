name: ShopFast CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------
  # JOB 1: Test & Lint Gating
  # ----------------------------------------------------------------
  test-and-lint:
    name: Backend Unit Tests & Code Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"

      - name: Build TypeScript Project
        working-directory: ./backend
        run: npm run build

      - name: Run Unit Tests with Coverage Check (>=60% Requirement)
        working-directory: ./backend
        run: npm run test:cov
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-dummy-jwt-secret-key-for-unit-testing-minimum-32-chars' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci-dummy-jwt-refresh-secret-key-for-unit-testing-min-32-chars' }}

  # ----------------------------------------------------------------
  # JOB 2: Build & Auto Deploy with Rollback Mechanism
  # ----------------------------------------------------------------
  deploy:
    name: Build Docker & Deploy to AWS EC2
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Setup SSH to target deployment server
      - name: Configure SSH Key
        if: env.EC2_HOST != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # Remote zero-downtime deployment script with automated rollback
      - name: Deploy and Verify Healthcheck (< 2 Minutes Rollback)
        if: env.EC2_HOST != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh $EC2_USER@$EC2_HOST << 'EOF'
            set -e
            cd /opt/shopfast || git clone https://github.com/chinhan142/ShopFast.git /opt/shopfast && cd /opt/shopfast
            
            # 1. Pull latest verified code
            git pull origin main
            
            # 2. Build and start updated containers
            docker compose pull || true
            docker compose up -d --build
            
            # 3. Wait and verify healthcheck
            echo "Waiting for services to become healthy..."
            sleep 15
            
            HEALTH_STATUS=0
            for i in {1..12}; do
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/v1/health || true)
              if [ "$RESPONSE" == "200" ]; then
                echo "Healthcheck PASSED (HTTP 200)!"
                HEALTH_STATUS=1
                break
              fi
              echo "Attempt $i: Health check returned $RESPONSE, retrying in 5s..."
              sleep 5
            done
            
            # 4. Automated Rollback if deployment fails
            if [ $HEALTH_STATUS -ne 1 ]; then
              echo "🚨 CRITICAL: Healthcheck failed! Initiating rollback to previous stable commit..."
              git reset --hard HEAD~1
              docker compose up -d --build
              echo "Rollback completed."
              exit 1
            fi
            
            echo "✅ Deployment succeeded and verified healthy!"
          EOF
